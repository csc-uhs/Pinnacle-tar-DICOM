[project]
name = "pinnacle-tar-dicom"
version = "0.2.0"
description = "Pinnacle TPS tar archive to DICOM converter for older Pinnacle versions (v8.x–v9.x)"
requires-python = ">=3.10"
dependencies = [
    "pydicom>=3.0.2",
    "numpy>=1.26.4",
]

[project.urls]
Repository = "https://github.com/csc-uhs/Pinnacle-tar-DICOM"